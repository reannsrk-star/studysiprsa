<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySip Café</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
              <img src="4ecd65da-340d-4237-bc01-a91fd67233cf_removalai_preview.png" alt="logo" width="240">
            </div>
            <div class="menu">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="menu.html">MENU</a></li>
                    <li><a href="mission.html">MISSION</a></li>
                    <li><a href="order.html">ORDER</a></li>
                    <li><a href="team.html">TEAM</a></li>
                    <li><a href="reviews.html">REVIEWS</a></li>
                </ul>
            </div>
            <div class="search">
                <input class="srch" type="search" name="">
                <button class="btn">Search</button>
            </div>
        </div>

        <!-- THIS IS YOUR ORDER HEADER -->
        <h1 class="menu-title">O R D E R</h1>

        <!-- FORM -->
        <div class="content">
            <form>
                <h2>Drinks</h2>
                <label><input type="checkbox" name="drink" value="Iced Coffee"> Iced Coffee</label><br>
                <label><input type="checkbox" name="drink" value="Milk Tea"> Milk Tea</label><br>
                <label><input type="checkbox" name="drink" value="Matcha"> Matcha</label><br>
                <label><input type="checkbox" name="drink" value="Italian Soda"> Italian Soda</label>

                <h2>Food</h2>
                <label><input type="checkbox" name="food" value="Sandwich"> Sandwich</label><br>
                <label><input type="checkbox" name="food" value="Croissant"> Croissant</label><br>
                <label><input type="checkbox" name="food" value="Pancakes"> Pancakes</label><br>
                <label><input type="checkbox" name="food" value="Cinnamon Roll"> Cinnamon Roll</label><br>
                <label><input type="checkbox" name="food" value="Churros"> Churros</label>

                <h2>Your Info</h2>
                <label for="name">Full Name</label><br>
                <input type="text" id="name" required><br><br>

                <label for="email">Email Address</label><br>
                <input type="email" id="email" required><br><br>

                <label for="cardName">Name on Card</label><br>
                <input type="text" id="cardName" required><br><br>

                <label for="cardNumber">Credit Card Number</label><br>
                <input type="text" id="cardNumber" required><br><br>

                <label for="address">Billing Address</label><br>
                <input type="text" id="address" required><br><br>

                <button type="button">Place Order</button>
            </form>
        </div>
    </div>
</body>
</html>
